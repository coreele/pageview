name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r typecheck

      - run: pnpm test

      - run: pnpm -r build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create extensions
        run: |
          psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS pageinspect;"
          psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS pg_walinspect;"

      - name: Seed smoke table
        run: |
          psql "$DATABASE_URL" -c "CREATE TABLE pageview_smoke (id int, payload text);"
          psql "$DATABASE_URL" -c "INSERT INTO pageview_smoke SELECT g, md5(g::text) FROM generate_series(1, 1000) g;"

      - run: pnpm test:integration

      - run: pnpm test:wal
